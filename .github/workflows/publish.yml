# Publishes the crate of a GitHub release to crates.io.
#
# Runs once the release, with its native library assets, is published. 
# Keep the filename stable. The crates-io environment gates the job on approval.
#
# Rerun for an existing release: Actions > publish > Run workflow, with its tag.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.0.0
        required: true

permissions: {}

jobs:
  crates-io:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - name: Check the crate version matches the tag
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq --raw-output '.packages[0].version')
          [ "v$version" = "$TAG" ] || { echo "Cargo.toml has $version, the tag is $TAG"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Skip a version crates.io already has
        id: exists
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user-agent "$GITHUB_REPOSITORY publish workflow" \
            "https://crates.io/api/v1/crates/simscale-cadlib/$VERSION")
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.exists.outputs.published == 'false'
        id: auth
      # Runs without the native lib: cargo publish only builds the library (an
      # rlib), which never links. Don't add cargo test here.
      - run: cargo publish
        if: steps.exists.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
